<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#188b66'><title>わたしの家計簿</title><link rel='manifest' href='manifest.webmanifest'><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18312a;background:#f7f8f6}*{box-sizing:border-box}body{margin:0;background:#f7f8f6}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:env(safe-area-inset-top) 16px calc(86px + env(safe-area-inset-bottom))}header{padding:18px 4px 10px}h1{font-size:22px;margin:0}.period{color:#718078;font-size:13px;margin-top:5px}.card{background:#f5f8f5;border-radius:18px;padding:16px;margin:12px 0}.balance{font-size:32px;font-weight:800;margin:5px 0}.muted{color:#7c8983;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.money{font-weight:750;font-size:20px}.green{color:#188b66}.red{color:#d84d4d}button,.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:700;background:#188b66;color:#fff;font-size:15px}.secondary{background:#eaf5f0;color:#187456}.list{margin-top:10px}.row{display:grid;grid-template-columns:62px 1fr 1fr 1fr;gap:7px;padding:12px 2px;border-bottom:1px solid #edf0ed;font-size:13px;align-items:center}.row.head{font-weight:700;color:#6c7872}.right{text-align:right}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #e8ece9;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:#75817b;padding:8px 2px;font-size:12px}.nav button.active{color:#188b66}.view{display:none}.view.active{display:block}label{font-size:13px;color:#66736d;display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border:1px solid #dfe6e1;border-radius:12px;font-size:16px;background:white}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.catrow{display:flex;justify-content:space-between;padding:15px 4px;border-bottom:1px solid #edf0ed;cursor:pointer}.catrow:active{opacity:.55}.detailrow{padding:14px 4px;border-bottom:1px solid #edf0ed}.detailtop{display:flex;justify-content:space-between;gap:12px}.detailmemo{font-size:13px;color:#7c8983;margin-top:5px}.danger{background:#fff0f0;color:#c93f3f}.smallbtn{padding:9px 12px;font-size:13px}.catrow b{font-size:16px}.empty{padding:25px;text-align:center;color:#829089}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf7f2;color:#187456;font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center}.periodnav{display:flex;gap:8px;align-items:center;margin:8px 0 4px}.periodnav button{padding:8px 11px}.periodnav .period{flex:1;text-align:center;margin:0}.barrow{margin:14px 0}.barhead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.bar{height:12px;background:#edf1ee;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:#188b66;border-radius:99px}.managecat{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf0ed}.managecat input{flex:1}.managecat button{padding:10px 12px}.note{font-size:12px;color:#7c8983;line-height:1.5}.compare{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ed}.up{color:#d84d4d}.down{color:#188b66}.same{color:#7c8983}
</style></head><body><main class='app'>
<section id='home' class='view active'><header><h1>わたしの家計簿</h1><div class='periodnav'><button class='secondary' onclick='movePeriod(-1)'>‹</button><div class='period' id='period'></div><button class='secondary' onclick='movePeriod(1)'>›</button></div></header><div class='card'><div class='muted'>前月残高</div><div id='carry' class='money'>¥0</div><div class='muted' style='margin-top:12px'>現在残高</div><div id='balance' class='balance green'>¥0</div></div><div class='grid'><div class='card'><div class='muted'>収入</div><div id='income' class='money green'>¥0</div></div><div class='card'><div class='muted'>支出</div><div id='expense' class='money red'>¥0</div></div></div><button style='width:100%' onclick="show('add')">＋ 収支を入力</button><div class='topline' style='margin-top:22px'><h2 style='font-size:18px;margin:0'>日別収支</h2><span class='pill'>15日〜翌14日</span></div><div class='row head'><span>日付</span><span class='right'>収入</span><span class='right'>支出</span><span class='right'>残高</span></div><div id='daily' class='list'></div></section>
<section id='add' class='view'><header><h1 id='formTitle'>収支を入力</h1><div class='period'>すべて手入力で保存されます</div></header><div class='card'><label>種類</label><select id='type'><option value='expense'>支出</option><option value='income'>収入</option></select><label>金額</label><input id='amount' type='number' inputmode='numeric' placeholder='例：1200'><label>日付</label><input id='date' type='date'><label>カテゴリー</label><select id='category'><option>食費</option><option>日用品</option><option>交通費</option><option>娯楽</option><option>服・美容</option><option>固定費</option><option>医療</option><option>その他</option></select><label>メモ</label><input id='memo' placeholder='例：スーパー'><div class='actions'><button class='secondary' onclick="show('home')">戻る</button><button id='saveEntryBtn' onclick='saveEntry()'>保存</button></div><button id='deleteEntryBtn' class='danger' style='display:none;width:100%;margin-top:10px' onclick='deleteEntry()'>この収支を削除</button></div></div></section>
<section id='analysis' class='view'><header><h1>カテゴリー別</h1><div class='periodnav'><button class='secondary' onclick='movePeriod(-1)'>‹</button><div class='period' id='period2'></div><button class='secondary' onclick='movePeriod(1)'>›</button></div></header><div class='card'><div class='muted'>期間内の支出合計</div><div id='expense2' class='balance red'>¥0</div></div><div class='card'><b>前月比</b><div id='monthCompare'></div></div><div id='chart' class='card'></div><div id='categoryCompare' class='card'></div><div id='cats'></div></section><section id='detail' class='view'><header><button class='secondary smallbtn' onclick="show('analysis')">← 分析へ</button><h1 id='detailTitle' style='margin-top:16px'>明細</h1><div class='period' id='detailPeriod'></div></header><div id='detailList'></div></section>
<section id='settings' class='view'><header><h1>設定</h1></header><div class='card'><b>前月繰越</b><p class='note'>2期間目以降は、前の期間の最終残高を自動で繰り越します。最初に使う期間だけ開始残高を入力してください。</p><label>この期間の開始残高（初回・調整用）</label><input id='carryInput' type='number' inputmode='numeric'><div class='actions'><button onclick='saveCarry()'>開始残高を保存</button></div></div><div class='card'><b>カテゴリー設定</b><div id='categoryManager'></div><div class='actions'><input id='newCategory' placeholder='新しいカテゴリー'><button onclick='addCategory()'>追加</button></div></div><div class='card'><b>過去の期間</b><div id='history'></div></div><div class='card'><b>データについて</b><p class='muted'>入力内容はこのブラウザ内に保存します。端末・ブラウザのデータ削除時に消える場合があります。</p><button class='secondary' style='width:100%' onclick='exportData()'>バックアップを書き出す</button></div></section>
</main><nav class='nav'><button data-v='home' class='active' onclick="show('home')">ホーム</button><button data-v='add' onclick="show('add')">入力</button><button data-v='analysis' onclick="show('analysis')">分析</button><button data-v='settings' onclick="show('settings')">設定</button></nav>
<script>
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP'); const key='kakeibo-v1';
let db=JSON.parse(localStorage.getItem(key)||'{"entries":[],"carry":{}}');
if(!db.categories) db.categories=['食費','日用品','交通費','娯楽','服・美容','固定費','医療','その他'];
let periodOffset=0, editingId=null;
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function rangeForOffset(off=periodOffset){let now=new Date(),y=now.getFullYear(),m=now.getMonth();if(now.getDate()<15)m--;let s=new Date(y,m+off,15),e=new Date(y,m+off+1,14);return{s,e,id:`${s.getFullYear()}-${s.getMonth()+1}`}}
function rangeFromDate(ds){let d=new Date(ds+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();if(d.getDate()<15)m--;let s=new Date(y,m,15),e=new Date(y,m+1,14);return{s,e,id:`${s.getFullYear()}-${s.getMonth()+1}`}}
function save(){localStorage.setItem(key,JSON.stringify(db))}
function periodEntries(r=rangeForOffset()){return db.entries.filter(x=>x.date>=iso(r.s)&&x.date<=iso(r.e)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)}
function totals(r){let es=periodEntries(r);return{inc:es.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp:es.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)}}
function previousRange(r){let s=new Date(r.s.getFullYear(),r.s.getMonth()-1,15),e=new Date(r.s.getFullYear(),r.s.getMonth(),14);return{s,e,id:`${s.getFullYear()}-${s.getMonth()+1}`}}
function hasAnyBefore(r){return db.entries.some(x=>x.date<iso(r.s))||Object.keys(db.carry||{}).some(k=>k!==r.id)}
function carryFor(r,seen=new Set()){if(seen.has(r.id))return 0;seen.add(r.id);if(db.carry[r.id]!==undefined)return Number(db.carry[r.id]||0);let pr=previousRange(r);let pt=totals(pr);if(!hasAnyBefore(r)&&!periodEntries(pr).length)return 0;return carryFor(pr,seen)+pt.inc-pt.exp}
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function syncCategorySelect(){category.innerHTML=db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}
function periodLabel(r){return `${r.s.getFullYear()}年${r.s.getMonth()+1}月15日 〜 ${r.e.getFullYear()}年${r.e.getMonth()+1}月14日`}
function render(){let r=rangeForOffset(),es=periodEntries(r),carry=carryFor(r),t=totals(r);document.querySelectorAll('#period,#period2').forEach(x=>x.textContent=periodLabel(r));carryInput.value=db.carry[r.id]!==undefined?db.carry[r.id]:'';document.getElementById('carry').textContent=yen(carry);income.textContent=yen(t.inc);expense.textContent=yen(t.exp);expense2.textContent=yen(t.exp);balance.textContent=yen(carry+t.inc-t.exp);
let by={};es.forEach(x=>(by[x.date]??=[]).push(x));let running=carry,html='';Object.keys(by).sort().forEach(d=>{let a=by[d].filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),b=by[d].filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);running+=a-b;html+=`<div class='row'><span>${Number(d.slice(5,7))}/${Number(d.slice(8))}</span><span class='right green'>${a?yen(a):'—'}</span><span class='right red'>${b?yen(b):'—'}</span><b class='right'>${yen(running)}</b></div>`});daily.innerHTML=html||`<div class='empty'>まだ入力がありません</div>`;
let cats={};es.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);let sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);let pr=previousRange(r),pt=totals(pr),pct=pt.exp?((t.exp-pt.exp)/pt.exp*100):null,delta=t.exp-pt.exp;monthCompare.innerHTML=`<div class='compare'><span>前月 ${yen(pt.exp)}</span><b class='${delta>0?'up':delta<0?'down':'same'}'>${delta>0?'＋':''}${yen(delta)} ${pct===null?(t.exp?'（前月データなし）':''):('（'+(pct>0?'+':'')+pct.toFixed(1)+'%）')}</b></div>`;let pc={};periodEntries(pr).filter(x=>x.type==='expense').forEach(x=>pc[x.category]=(pc[x.category]||0)+x.amount);let all=[...new Set([...Object.keys(cats),...Object.keys(pc)])].sort((a,b)=>(cats[b]||0)-(cats[a]||0));categoryCompare.innerHTML='<b>カテゴリー別 前月比</b>'+ (all.length?all.map(c=>{let a=cats[c]||0,b=pc[c]||0,d=a-b,p=b?d/b*100:null;return `<div class="compare"><span>${esc(c)}<div class="note">今月 ${yen(a)} / 前月 ${yen(b)}</div></span><b class="${d>0?'up':d<0?'down':'same'}">${d>0?'＋':''}${yen(d)}${p===null?'':` (${p>0?'+':''}${p.toFixed(1)}%)`}</b></div>`}).join(''):'<div class="empty">比較する支出がありません</div>');catsEl=document.getElementById('cats');catsEl.innerHTML=sorted.map(([c,v])=>`<div class='catrow' onclick='openCategory(${JSON.stringify(c)})'><span>${esc(c)} ›</span><b>${yen(v)}</b></div>`).join('')||`<div class='empty'>支出を入力するとカテゴリー別に集計されます</div>`;chart.innerHTML=sorted.length?sorted.map(([c,v])=>`<div class='barrow'><div class='barhead'><span>${esc(c)}</span><b>${yen(v)}</b></div><div class='bar'><i style='width:${t.exp?Math.max(3,v/t.exp*100):0}%'></i></div></div>`).join(''):`<div class='empty'>グラフに表示する支出がありません</div>`;renderSettings();syncCategorySelect()}
function renderSettings(){categoryManager.innerHTML=db.categories.map((c,i)=>`<div class='managecat'><input value='${esc(c)}' onchange='renameCategory(${i},this.value)'><button class='danger' onclick='removeCategory(${i})'>削除</button></div>`).join('');let ids=new Set(db.entries.map(x=>rangeFromDate(x.date).id));Object.keys(db.carry||{}).forEach(x=>ids.add(x));let rs=[...ids].map(id=>{let [y,m]=id.split('-').map(Number);return{s:new Date(y,m-1,15),e:new Date(y,m,14),id}}).sort((a,b)=>b.s-a.s);history.innerHTML=rs.map(r=>{let t=totals(r),bal=carryFor(r)+t.inc-t.exp;return`<div class='catrow' onclick='jumpToPeriod(${r.s.getFullYear()},${r.s.getMonth()})'><span>${r.s.getFullYear()}年${r.s.getMonth()+1}月15日〜</span><b>${yen(bal)} ›</b></div>`}).join('')||`<div class='empty'>履歴はまだありません</div>`}
function movePeriod(n){periodOffset+=n;render()}
function jumpToPeriod(y,m){let now=rangeForOffset(0).s,target=new Date(y,m,15);periodOffset=(target.getFullYear()-now.getFullYear())*12+(target.getMonth()-now.getMonth());show('home')}
function resetForm(){editingId=null;formTitle.textContent='収支を入力';saveEntryBtn.textContent='保存';deleteEntryBtn.style.display='none';amount.value='';memo.value='';date.value=iso(new Date())}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='add'&&!editingId)resetForm();render()}
function saveEntry(){let a=Number(amount.value);if(!a)return alert('金額を入力してください');let obj={id:editingId||Date.now(),type:type.value,amount:a,date:date.value||iso(new Date()),category:category.value,memo:memo.value};if(editingId){let i=db.entries.findIndex(x=>x.id===editingId);if(i>=0)db.entries[i]=obj}else db.entries.push(obj);save();resetForm();show('home')}
function editEntry(id){let x=db.entries.find(x=>x.id===id);if(!x)return;editingId=id;syncCategorySelect();if(!db.categories.includes(x.category)){let o=document.createElement('option');o.textContent=x.category;category.appendChild(o)}type.value=x.type;amount.value=x.amount;date.value=x.date;category.value=x.category;memo.value=x.memo||'';formTitle.textContent='収支を編集';saveEntryBtn.textContent='変更を保存';deleteEntryBtn.style.display='block';show('add')}
function deleteEntry(){if(!editingId||!confirm('この収支を削除しますか？'))return;db.entries=db.entries.filter(x=>x.id!==editingId);save();resetForm();show('home')}
function openCategory(c){let r=rangeForOffset(),xs=periodEntries(r).filter(x=>x.type==='expense'&&x.category===c).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);detailTitle.textContent=c+'の明細';detailPeriod.textContent=periodLabel(r);detailList.innerHTML=xs.map(x=>`<div class='detailrow' onclick='editEntry(${x.id})'><div class='detailtop'><span><b>${Number(x.date.slice(5,7))}/${Number(x.date.slice(8))}</b>${x.memo?`<div class='detailmemo'>${esc(x.memo)}</div>`:''}</span><b>${yen(x.amount)} ›</b></div></div>`).join('')||`<div class='empty'>明細がありません</div>`;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='detail'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'))}
function saveCarry(){let r=rangeForOffset(),v=carryInput.value.trim();if(v==='')delete db.carry[r.id];else db.carry[r.id]=Number(v);save();render();alert('保存しました')}
function addCategory(){let c=newCategory.value.trim();if(!c)return;if(db.categories.includes(c))return alert('同じカテゴリーがあります');db.categories.push(c);newCategory.value='';save();render()}
function renameCategory(i,v){v=v.trim();if(!v)return render();let old=db.categories[i];if(db.categories.some((x,j)=>j!==i&&x===v))return alert('同じカテゴリーがあります');db.categories[i]=v;db.entries.forEach(x=>{if(x.category===old)x.category=v});save();render()}
function removeCategory(i){let c=db.categories[i];if(db.categories.length<=1)return alert('カテゴリーは1つ以上必要です');if(db.entries.some(x=>x.category===c)&&!confirm(`「${c}」の過去データがあります。カテゴリーだけ削除しますか？\n過去の明細はそのまま残ります。`))return;db.categories.splice(i,1);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kakeibo-backup.json';a.click();URL.revokeObjectURL(a.href)}
syncCategorySelect();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
